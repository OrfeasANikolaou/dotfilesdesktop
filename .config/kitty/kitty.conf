color3  #b26818
color11 #f7d00e
#: yellow

color4  #1616b5
color12 #5050ff
#: blue

color5  #b218b2
color13 #ff54ff
#: magenta

color6  #18b2b2
color14 #54ffff
#: cyan

color7  #b2b2b2
color15 #ffffff
#: white

# mark1_foreground black

#: Color for marks of type 1

# mark1_background #98d3cb

#: Color for marks of type 1 (light steel blue)

# mark2_foreground black

#: Color for marks of type 2

# mark2_background #f2dcd3

#: Color for marks of type 1 (beige)

# mark3_foreground black

#: Color for marks of type 3

# mark3_background #f274bc

#: Color for marks of type 3 (violet)

#: }}}


#: Advanced {{{

shell .

#: The shell program to execute. The default value of . means to use
#: the value of of the SHELL environment variable or if unset,
#: whatever shell is set as the default shell for the current user.
#: Note that on macOS if you change this, you might need to add
#: --login and --interactive to ensure that the shell starts in
#: interactive mode and reads its startup rc files. Environment
#: variables are expanded in this setting.

# editor .

#: The terminal based text editor (such as vim or nano) to use when
#: editing the kitty config file or similar tasks.

#: The default value of . means to use the environment variables
#: VISUAL and EDITOR in that order. If these variables aren't set,
#: kitty will run your shell ($SHELL -l -i -c env) to see if your
#: shell startup rc files set VISUAL or EDITOR. If that doesn't work,
#: kitty will cycle through various known editors (vim, emacs, etc.)
#: and take the first one that exists on your system.

#: }}}

#: Keyboard shortcuts {{{

#: Keys are identified simply by their lowercase Unicode characters.
#: For example: a for the A key, [ for the left square bracket key,
#: etc. For functional keys, such as Enter or Escape, the names are
#: present at Functional key definitions
#: <https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional>.
#: For modifier keys, the names are ctrl (control, ⌃), shift (⇧), alt
#: (opt, option, ⌥), super (cmd, command, ⌘).

#: Simple shortcut mapping is done with the map directive. For full
#: details on advanced mapping including modal and per application
#: maps, see mapping <https://sw.kovidgoyal.net/kitty/mapping/>. Some
#: quick examples to illustrate common tasks::

 kitty_mod ctrl+shift

#: Special modifier key alias for default shortcuts. You can change
#: the value of this option to alter all default shortcuts that use
#: kitty_mod.

clear_all_shortcuts yes
#: Remove all shortcut definitions up to this point. Useful, for
#: instance, to remove the default shortcuts.


# action_alias

action_alias launch_tab launch --type=tab --cwd=current

#: Define action aliases to avoid repeating the same options in
#: multiple mappings. Aliases can be defined for any action and will
#: be expanded recursively. For example, the above alias allows you to
#: create mappings to launch a new tab in the current working
#: directory without duplication::

map super+page_up no_op

map kitty_mod+e launch_tab nvim
map kitty_mod+r launch_tab newsboat
map kitty_mod+m launch_tab mpv --shuffle=yes --no-audio-display --loop-playlist=inf --no-video --volume=43 ~/music

#: Clipboard {{{

#: Copy to clipboard
map kitty_mod+c copy_to_clipboard

#: Paste from clipboard
map kitty_mod+v paste_from_clipboard

#: }}}

#: Scrolling {{{

#: Scroll page up
map kitty_mod+page_up scroll_page_up
map kitty_mod+k       scroll_page_up

#: Scroll page down
map kitty_mod+page_down scroll_page_down
map kitty_mod+j         scroll_page_down

#: Scroll to top
map kitty_mod+home scroll_home

#: Scroll to bottom
map kitty_mod+end scroll_end

#: }}}

#: Window management {{{

#: New window
#map kitty_mod+enter new_window
# map cmd+enter       new_window

#::  You can open a new window with the current working directory set
#::  to the working directory of the current window using::
enabled_layouts tall
map kitty_mod+t launch --location=vsplit --cwd=current

#: Detach a window, moving it to another tab or OS Window
map kitty_mod+d detach_window

#: Close window
map kitty_mod+w close_window

#: Next window
map kitty_mod+] next_window

#: Previous window
map kitty_mod+[ previous_window

#: Move window forward
# map kitty_mod+f move_window_forward

#: Move window backward
# map kitty_mod+b move_window_backward

#: Move window to top

# map kitty_mod+` move_window_to_top

#: Start resizing window

# map cmd+r       start_resizing_window

#: }}}

#: Tab management {{{

#: Next tab
map kitty_mod+right next_tab
map kitty_mod+l next_tab

#: Previous tab
map kitty_mod+left previous_tab
map kitty_mod+h previous_tab

#: New tab
map kitty_mod+x launch_tab --cwd=current --location=after

#: Close OS window
map kitty_mod+q close_os_window

#: Move tab forward
map kitty_mod+. move_tab_forward

#: Move tab backward
map kitty_mod+, move_tab_backward

#: Set tab title
map kitty_mod+alt+t set_tab_title


#: You can also create shortcuts to go to specific tabs, with 1 being
#: the first tab, 2 the second tab and -1 being the previously active
#: tab, -2 being the tab active before the previously active tab and
#: so on. Any number larger than the number of tabs goes to the last
#: tab and any number less than the number of previously used tabs in
#: the history goes to the oldest previously used tab in the history::

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 100

#: Just as with new_window above, you can also pass the name of
#: arbitrary commands to run when using new_tab and new_tab_with_cwd.
#: Finally, if you want the new tab to open next to the current tab
#: rather than at the end of the tabs list, use::

#:     map ctrl+t new_tab !neighbor [optional cmd to run]
#: }}}


#: Font sizes {{{

#: You can change the font size for all top-level kitty OS windows at
#: a time or only the current one.

#: Increase font size
map kitty_mod+equal  change_font_size all +2.0

#: Decrease font size
map kitty_mod+minus       change_font_size all -2.0

#: Reset font size
map kitty_mod+backspace change_font_size all 0

#: }}}
#: Miscellaneous {{{

#: Show documentation

map kitty_mod+f1 show_kitty_doc overview

#: }}}


# currently not needed since it's installed by package manager, but just in case
update_check_interval 0

# explicit security
allow_remote_control no
